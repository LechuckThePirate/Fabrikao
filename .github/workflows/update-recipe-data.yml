name: Update recipe data

# The recipe data (Data/Generated/Recipes.lua) is generated by a daily job on the maintainer's server from public databases, which
# publishes the file at the media host. This workflow fetches it, runs the tests and opens a pull request when it differs from
# the repo. Nothing is merged here. The server holds no credentials for this repo; this is the only way the file gets in. Needs
# the repo setting "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: '50 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-recipe-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the published file
        run: |
          base=https://media.joanvilarino.online/fabrikao-data
          # a stale stamp means the server job stopped: fail so it gets noticed
          stamp=$(curl -fsS --retry 3 "$base/updated.txt")
          age=$(( $(date +%s) - $(date -d "$stamp" +%s) ))
          if [ "$age" -gt $(( 3 * 86400 )) ]; then
            echo "::error::The published data is $(( age / 3600 )) hours old ($stamp)"
            exit 1
          fi
          f="$RUNNER_TEMP/Recipes.lua"
          curl -fsS --retry 3 -o "$f" "$base/Recipes.lua"
          # shape checks, so an error page or a truncated file never reaches a pull request
          [ "$(wc -c < "$f")" -gt 300000 ]
          [ "$(head -1 "$f")" = 'local _, ns = ...' ]
          grep -q '^-- GENERATED' "$f"
          grep -q '^ns.RECIPE_DATA = {' "$f"
          # and it must not have lost recipes
          count() { grep -c '^        \[[0-9]*\] = {s=' "$1" || true; }
          old=0
          [ -f Data/Generated/Recipes.lua ] && old=$(count Data/Generated/Recipes.lua)
          [ "$(count "$f")" -ge $(( old * 95 / 100 )) ]
          mkdir -p Data/Generated
          cp "$f" Data/Generated/Recipes.lua

      - name: Detect changes
        id: changes
        run: |
          # the generation date alone is not a change worth a pull request
          # (a master with no data yet counts as a change)
          if [ -n "$(git ls-files Data/Generated/Recipes.lua)" ] && git diff --quiet -I'^    generated = ' -- Data/Generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Data/Generated is already up to date with the published file."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests opened with the default token do not trigger ci.yml, so the tests run here.
      - name: Install Lua 5.1
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-lua@8aace3457a2fcf3f3c4e9007ecc6b869ff6d74d6 # v11
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        if: steps.changes.outputs.changed == 'true'
        uses: leafo/gh-actions-luarocks@4c082a5fad45388feaeb0798dbd82dbd7dc65bca # v5

      - name: Install busted
        if: steps.changes.outputs.changed == 'true'
        run: luarocks install busted

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: busted -p ".test.lua" .

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: auto/recipe-data
          base: master
          add-paths: Data/Generated
          commit-message: "data: refresh recipes"
          title: "data: refresh recipes"
          body: |
            Automated daily refresh of the recipe data (`Data/Generated/Recipes.lua`), generated on the maintainer's server and
            fetched here. Busted passed on this branch.

            Review the diff, add a line under `## Unreleased` in `CHANGELOG.md` if it is worth telling players about, and merge.
            If this PR is closed without merging, the next run opens a new one.
